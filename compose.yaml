name: hspsi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?请在部署环境文件中配置 DATABASE_URL，且数据库必须为 hspsi-dev-ai-02}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请配置不少于32字符的 JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-45m}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
